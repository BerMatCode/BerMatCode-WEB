<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🚀 BerMatCode Panel</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}

input, button {
  margin: 8px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

button {
  background: purple;
  color: white;
  cursor: pointer;
}

#loader {
  display: none;
  margin: 10px;
}

.card {
  background: #222;
  padding: 10px;
  margin: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h2>🚀 BerMatCode Panel</h2>

<input type="text" id="titulo" placeholder="Título"><br>
<input type="text" id="descripcion" placeholder="Descripción"><br>
<input type="text" id="imagen" placeholder="URL Imagen"><br>
<input type="file" id="file"><br>

<button onclick="subir()">Subir Proyecto</button>

<div id="loader">⏳ Subiendo...</div>
<p id="msg"></p>

<hr>

<h3>📦 Proyectos</h3>
<div id="lista"></div>

<script>

const API = "https://bermatcode1.onrender.com";

async function subir() {
  const file = document.getElementById("file").files[0];
  const titulo = document.getElementById("titulo").value;
  const descripcion = document.getElementById("descripcion").value;
  const imagen = document.getElementById("imagen").value;

  if (!file) return alert("Sube un HTML");

  const formData = new FormData();
  formData.append("file", file);
  formData.append("titulo", titulo);
  formData.append("descripcion", descripcion);
  formData.append("imagen", imagen);

  document.getElementById("loader").style.display = "block";

  try {
    const res = await fetch(API + "/upload", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    document.getElementById("loader").style.display = "none";

    if (data.ok) {
      document.getElementById("msg").innerText = "✅ Subido correctamente";
      cargar();
    } else {
      document.getElementById("msg").innerText = "❌ Error";
      console.log(data);
    }

  } catch (err) {
    document.getElementById("loader").style.display = "none";
    document.getElementById("msg").innerText = "❌ Error conexión";
    console.log(err);
  }
}

async function cargar() {
  const res = await fetch(API + "/proyectos");
  const data = await res.json();

  const cont = document.getElementById("lista");
  cont.innerHTML = "";

  data.reverse().forEach(p => {
    cont.innerHTML += `
      <div class="card">
        <h4>${p.titulo}</h4>
        <p>${p.descripcion}</p>
        <img src="${p.imagen}" width="150"><br>
        <a href="${p.url}" target="_blank">Ver</a>
      </div>
    `;
  });
}

cargar();

</script>

</body>
</html>
